# Alba — /usr/lib/dracut.conf.d/10-bootc-base.conf
# Copié du jeu baseimage upstream de bootc.
# Image générique (pas de hostonly côté build) + modules ostree et bootc dans l'initramfs.
hostonly=no
add_dracutmodules+=" ostree bootc "
# Spécifique OMV : EROFS + overlayfs sont des MODULES (pas builtin) dans le noyau ROME.
# On force leur inclusion pour que la racine composefs se monte au boot.
add_drivers+=" erofs overlay "
