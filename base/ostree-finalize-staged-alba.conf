# Alba — après qu'ostree a finalisé le déploiement staged à l'extinction (écriture
# de l'entrée BLS définitive, bascule du symlink /boot/loader), on régénère grub.cfg
# avec des menuentries explicites pointant le nouveau déploiement. S'exécute dans la
# même chaîne ExecStop qu'ostree, donc APRÈS la finalisation : aucune course.
[Service]
ExecStop=/usr/lib/alba/gen-grub-menu-rw.sh
